<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" id="logo-link">
                <img src="images/logo.png" alt="Project X Logo" id="logo">
            </a>
            <ul>
                <li><a href="#rent">Rent</a></li>
                <li><a href="#lend">Lend</a></li>
                <li><a href="#WhoWeAre">Who we are</a></li>
                <li><a href="#profile">My profile</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="btn">Log in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h1>Need it. Use it. Return it.</h1>
        
            <form id="search-form">
                <input type="text" name="location" placeholder="Type city or Zip code" required>
                
                <select name="category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="electronics">Electronics</option>
                    <option value="furniture">Furniture</option>
                    <option value="tools">Tools</option>
                    <option value="vehicles">Vehicles</option>
                    <option value="sports">Sports</option>
                </select>
        
                <input type="text" name="keyword" placeholder="Search keyword">
        
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="principalProducts">
            <h2>Popular Items for Rent</h2>
            <div class="product-grid" id="productGrid"></div>
        </section>
        
                
    </main>

    <script>
        // Assets stay local; text (title/price) comes from API GET /item.
        const assets = [
            { href: 'hammer.html', image: 'images/hammer.png' },
            { href: 'product2.html', image: 'images/drill.png' },
            { href: 'product3.html', image: 'images/wrench.png' },
            { href: 'product4.html', image: 'images/hammer2.png' },
            { href: 'product5.html', image: 'images/drill2.png' },
            { href: 'product6.html', image: 'images/saw.png' }
        ];

        const fallbackProducts = [
            { title: 'Hammer', price: '1.00€ /day' },
            { title: 'Electric Drill', price: '1.50€ /day' },
            { title: 'Adjustable Wrench', price: '2.50€ /day' },
            { title: 'Woodworking Hammer', price: '2.00€ /day' },
            { title: 'Cordless Drill', price: '3.00€ /day' },
            { title: 'Hand Saw', price: '1.50€ /day' }
        ];

        const grid = document.getElementById('productGrid');

        function renderCards(products) {
            grid.innerHTML = products.map(({ title, price }, idx) => {
                const asset = assets[idx] || assets[assets.length - 1];
                const href = asset.href;
                const image = asset.image;
                const alt = `${title} for rent`;
                return `
                    <a href="${href}" class="product-card">
                        <img src="${image}" alt="${alt}">
                        <h3>${title}</h3>
                        <p>${price}</p>
                    </a>
                `;
            }).join('');
        }

        async function loadProducts() {
            try {
                const res = await fetch('http://localhost:3000/item');
                if (!res.ok) throw new Error('Failed to fetch items');
                const data = await res.json();
                const items = Array.isArray(data.items) ? data.items : [];
                if (!items.length) {
                    renderCards(fallbackProducts);
                    return;
                }
                const mapped = items.map((item) => ({
                    title: item.title || 'Untitled item',
                    price: item.price ? `${item.price}€ /day` : 'N/A'
                }));
                renderCards(mapped);
            } catch (err) {
                console.error(err);
                renderCards(fallbackProducts);
            }
        }

        loadProducts();
    </script>

    <!-- <footer>
        <p>&copy; 2023 Project X. All rights reserved.</p>
    </footer> -->
</body>
</html>
