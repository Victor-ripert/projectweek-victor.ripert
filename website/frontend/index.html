<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" id="logo-link">
                <img src="images/logo.png" alt="Project X Logo" id="logo">
            </a>
            <ul>
                <li><a href="#rent">Rent</a></li>
                <li><a href="#lend">Lend</a></li>
                <li><a href="#WhoWeAre">Who we are</a></li>
                <li><a href="#profile">My profile</a></li>
                <li><a href="login.html" class="btn">Log in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h1>Need it. Use it. Return it.</h1>
        
            <form id="search-form">
                <input type="text" name="location" placeholder="Type city or Zip code" required>
                
                <select name="category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="electronics">Electronics</option>
                    <option value="furniture">Furniture</option>
                    <option value="tools">Tools</option>
                    <option value="vehicles">Vehicles</option>
                    <option value="sports">Sports</option>
                </select>
        
                <input type="text" name="keyword" placeholder="Search keyword">
        
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="principalProducts">
            <h2>Popular Items for Rent</h2>
            <div class="product-grid">
                <a href="hammer.html" class="product-card">
                    <img src="images/hammer.png" alt="Steel Hammer for Rent">
                    <h3>Hammer</h3>
                    <p>1.00€ /day</p>
                </a>
                <a href="product2.html" class="product-card">
                    <img src="images/drill.png" alt="Electric Drill for Rent">
                    <h3>Electric Drill</h3>
                    <p>1.50€ /day</p>
                </a>
                <a href="product3.html" class="product-card">
                    <img src="images/wrench.png" alt="Adjustable Wrench for Rent">
                    <h3>Adjustable Wrench</h3>
                    <p>2.50€ /day</p>
                </a>
                <a href="product4.html" class="product-card">
                    <img src="images/hammer2.png" alt="Woodworking Hammer for Rent">
                    <h3>Woodworking Hammer</h3>
                    <p>2.00€ /day</p>
                </a>
                <a href="product5.html" class="product-card">
                    <img src="images/drill2.png" alt="Cordless Drill for Rent">
                    <h3>Cordless Drill</h3>
                    <p>3.00€ /day</p>
                </a>
                <a href="product6.html" class="product-card">
                    <img src="images/saw.png" alt="Hand Saw for Rent">
                    <h3>Hand Saw</h3>
                    <p>$1.50€ /day</p>
                </a>
            </div>
        </section>
        
                
    </main>

    <!-- <footer>
        <p>&copy; 2023 Project X. All rights reserved.</p>
    </footer> -->
</body>
</html>
