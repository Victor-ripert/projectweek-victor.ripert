<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Quick polish for add-item form */
        #addItem {
            max-width: 720px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }
        #addItem h2 {
            margin-bottom: 0.75rem;
        }
        #add-item-form {
            display: grid;
            gap: 0.75rem;
        }
        #add-item-form input,
        #add-item-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 1rem;
        }
        #add-item-form textarea { min-height: 100px; resize: vertical; }
        #add-item-form button {
            padding: 0.75rem 1rem;
            background: #0d9488;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        #add-item-form button:hover { background: #0b7d72; }
        #add-item-form button:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#" id="logo-link">
                <img src="images/logo.png" alt="Project X Logo" id="logo">
            </a>
            <ul>
                <li><a href="#rent">Rent</a></li>
                <li><a href="#lend">Lend</a></li>
                <li><a href="#WhoWeAre">Who we are</a></li>
                <li><a href="#profile">My profile</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="btn">Log in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h1>Need it. Use it. Return it.</h1>
        
            <form id="search-form">
                <input type="text" name="location" placeholder="Type city or Zip code" required>
                
                <select name="category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="electronics">Electronics</option>
                    <option value="furniture">Furniture</option>
                    <option value="tools">Tools</option>
                    <option value="vehicles">Vehicles</option>
                    <option value="sports">Sports</option>
                </select>
        
                <input type="text" name="keyword" placeholder="Search keyword">
        
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="principalProducts">
            <h2>Popular Items for Rent</h2>
            <div class="product-grid" id="productGrid"></div>
        </section>

        <section id="addItem" style="margin-top: 2rem;">
            <h2>Add a new item</h2>
            <form id="add-item-form">
                <input type="text" name="title" placeholder="Title" required>
                <textarea name="description" placeholder="Description" required></textarea>
                <input type="number" step="0.01" name="price" placeholder="Price (€)" required>
                <input type="text" name="status" placeholder="Status (e.g. available)" required>
                <input type="number" name="user_id" placeholder="User ID" required>
                <button type="submit">Add item</button>
            </form>
        </section>
        
                
    </main>

    <script>
        // Assets stay local; text (title/price) comes from API GET /item.
        const assets = [
            { href: 'hammer.html', image: 'images/hammer.png' },
            { href: 'product2.html', image: 'images/drill.png' },
            { href: 'product3.html', image: 'images/wrench.png' },
            { href: 'product4.html', image: 'images/hammer2.png' },
            { href: 'product5.html', image: 'images/drill2.png' },
            { href: 'product6.html', image: 'images/saw.png' }
        ];

        const fallbackProducts = [
            { title: 'Hammer', price: '1.00€ /day' },
            { title: 'Electric Drill', price: '1.50€ /day' },
            { title: 'Adjustable Wrench', price: '2.50€ /day' },
            { title: 'Woodworking Hammer', price: '2.00€ /day' },
            { title: 'Cordless Drill', price: '3.00€ /day' },
            { title: 'Hand Saw', price: '1.50€ /day' }
        ];

        const grid = document.getElementById('productGrid');

        function renderCards(products) {
            grid.innerHTML = products.map(({ title, price, id }, idx) => {
                const asset = assets[idx] || assets[assets.length - 1];
                const href = id ? `item.html?id=${id}` : asset.href;
                const image = asset.image;
                const alt = `${title} for rent`;
                return `
                    <a href="${href}" class="product-card">
                        <img src="${image}" alt="${alt}">
                        <h3>${title}</h3>
                        <p>${price}</p>
                    </a>
                `;
            }).join('');
        }

        async function loadProducts() {
            try {
                const res = await fetch('http://localhost:3000/item');
                if (!res.ok) throw new Error('Failed to fetch items');
                const data = await res.json();
                const items = Array.isArray(data.items) ? data.items : [];
                if (!items.length) {
                    renderCards(fallbackProducts);
                    return;
                }
                const mapped = items.map((item) => ({
                    id: item.id,
                    title: item.title || 'Untitled item',
                    price: item.price ? `${item.price}€ /day` : 'N/A'
                }));
                renderCards(mapped);
            } catch (err) {
                console.error(err);
                renderCards(fallbackProducts);
            }
        }

        loadProducts();

        // Handle add-item form submit
        const addItemForm = document.getElementById('add-item-form');
        addItemForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(addItemForm);
            const payload = Object.fromEntries(formData.entries());
            // Coerce numbers
            payload.price = Number(payload.price);
            payload.user_id = Number(payload.user_id);
            try {
                const res = await fetch('http://localhost:3000/item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const msg = await res.text();
                    alert('Failed to add item: ' + msg);
                    return;
                }
                // Refresh list after successful add
                await loadProducts();
                addItemForm.reset();
            } catch (err) {
                console.error(err);
                alert('Network error, please try again.');
            }
        });
    </script>

    <!-- <footer>
        <p>&copy; 2023 Project X. All rights reserved.</p>
    </footer> -->
</body>
</html>
