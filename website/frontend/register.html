<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" id="logo-link">
                <img src="images/logo.png" alt="Project X Logo" id="logo">
            </a>
            <ul>
                <li><a href="#rent">Rent</a></li>
                <li><a href="#lend">Lend</a></li>
                <li><a href="#WhoWeAre">Who we are</a></li>
                <li><a href="#profile">My profile</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="btn">Log in</a></li>
            </ul>
        </nav>
    </header>

    <!-- <main> -->
        <section id="register">
            <h1>Register</h1>
        
            <form id="register-form" action="http://localhost:3000/register" method="post">
                <label for="firstname">First name:</label><br>
                <input type="text" id="firstname" name="firstname" placeholder="First Name" required><br><br>
        
                <label for="lastname">Last name:</label><br>
                <input type="text" id="lastname" name="lastname" placeholder="Last Name" required><br><br>
        
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Email" required><br><br>
        
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Password" required><br><br>
        
                <button type="submit">Submit</button>
            </form>
        </section>

        
                
    <!-- </main> -->


    <script>
        // Intercept form submit to POST, store token if returned, then redirect to index.html
        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(registerForm);
            const payload = Object.fromEntries(formData.entries());
            try {
                const response = await fetch(registerForm.action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const message = await response.text();
                    alert('Registration failed: ' + message);
                    return;
                }
                const data = await response.json().catch(() => ({}));
                if (data.token) {
                    localStorage.setItem('token', data.token);
                }
                window.location.href = 'index.html';
            } catch (error) {
                console.error(error);
                alert('Network error, please try again.');
            }
        });
    </script>

</body>
</html>
